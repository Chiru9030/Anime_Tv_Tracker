version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: anime_tracker_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: anime_tracker
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: anime_tracker_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/anime_tracker
      - JWT_SECRET=production_anime_tracker_secret_2026
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: anime_tracker_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
